name: Inspect Corkboard hero artwork

on:
  push:
    paths:
      - .github/workflows/inspect-corkboard-hero.yml

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          image = Image.open('docs/assets/corkboard-hero.png').convert('RGB')
          image.resize((256, 144), Image.Resampling.LANCZOS).save(
              'docs/assets/corkboard-inspection.jpg', format='JPEG', quality=34, optimize=True
          )
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/corkboard-inspection.jpg
          git commit -m "chore: add temporary Corkboard artwork preview"
          git push
